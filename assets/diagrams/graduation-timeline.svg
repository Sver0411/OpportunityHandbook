<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" font-family="PingFang SC, Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#9c9c9c" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<title>毕业前到离校后的时间线</title>
<text x="40" y="52" font-size="13" fill="#8a8a8a" font-weight="400" text-anchor="start">场景 6 · 毕业离校</text>
<text x="40" y="92" font-size="27" fill="#1f1f1f" font-weight="500" text-anchor="start">五个节点的硬事项</text>
<text x="40" y="122" font-size="15" fill="#5f5f5f" font-weight="400" text-anchor="start">线上是节点，节点上下分开写：上面是有截止日的，下面是能提前做的。</text>
<line x1="60" y1="212" x2="700" y2="212" stroke="#cfcbc3" stroke-width="2"/>
<circle cx="70" cy="212" r="6" fill="#2f5d8a"/>
<text x="80" y="200" font-size="13.5" fill="#1f1f1f" font-weight="500" text-anchor="start">前 6 个月</text>
<text x="70" y="180" font-size="11.5" fill="#5f5f5f" font-weight="400" text-anchor="start">论文中期</text>
<text x="70" y="162" font-size="11.5" fill="#5f5f5f" font-weight="400" text-anchor="start">学位申请材料</text>
<text x="70" y="144" font-size="11.5" fill="#5f5f5f" font-weight="400" text-anchor="start">去向登记</text>
<line x1="70" y1="202" x2="70" y2="208" stroke="#cfcbc3" stroke-width="1"/>
<circle cx="230" cy="212" r="6" fill="#2f5d8a"/>
<text x="240" y="236" font-size="13.5" fill="#1f1f1f" font-weight="500" text-anchor="start">前 3 个月</text>
<text x="230" y="258" font-size="11.5" fill="#5f5f5f" font-weight="400" text-anchor="start">成绩单多开几份</text>
<text x="230" y="276" font-size="11.5" fill="#5f5f5f" font-weight="400" text-anchor="start">问清档案流程</text>
<text x="230" y="294" font-size="11.5" fill="#5f5f5f" font-weight="400" text-anchor="start">就业协议或录取</text>
<line x1="230" y1="216" x2="230" y2="222" stroke="#cfcbc3" stroke-width="1"/>
<circle cx="390" cy="212" r="6" fill="#2f5d8a"/>
<text x="400" y="200" font-size="13.5" fill="#1f1f1f" font-weight="500" text-anchor="start">前 1 个月</text>
<text x="390" y="180" font-size="11.5" fill="#5f5f5f" font-weight="400" text-anchor="start">答辩与查重</text>
<text x="390" y="162" font-size="11.5" fill="#5f5f5f" font-weight="400" text-anchor="start">毕业资格公示</text>
<text x="390" y="144" font-size="11.5" fill="#5f5f5f" font-weight="400" text-anchor="start">离校手续单</text>
<line x1="390" y1="202" x2="390" y2="208" stroke="#cfcbc3" stroke-width="1"/>
<circle cx="550" cy="212" r="6" fill="#2f5d8a"/>
<text x="560" y="236" font-size="13.5" fill="#1f1f1f" font-weight="500" text-anchor="start">毕业当月</text>
<text x="550" y="258" font-size="11.5" fill="#5f5f5f" font-weight="400" text-anchor="start">领证</text>
<text x="550" y="276" font-size="11.5" fill="#5f5f5f" font-weight="400" text-anchor="start">档案转递</text>
<text x="550" y="294" font-size="11.5" fill="#5f5f5f" font-weight="400" text-anchor="start">户口迁移</text>
<line x1="550" y1="216" x2="550" y2="222" stroke="#cfcbc3" stroke-width="1"/>
<circle cx="700" cy="212" r="6" fill="#2f5d8a"/>
<text x="710" y="200" font-size="13.5" fill="#1f1f1f" font-weight="500" text-anchor="start">离校后 1 个月</text>
<text x="700" y="180" font-size="11.5" fill="#5f5f5f" font-weight="400" text-anchor="start">入职或入学</text>
<text x="700" y="162" font-size="11.5" fill="#5f5f5f" font-weight="400" text-anchor="start">社保起缴</text>
<text x="700" y="144" font-size="11.5" fill="#5f5f5f" font-weight="400" text-anchor="start">确认档案到达</text>
<line x1="700" y1="202" x2="700" y2="208" stroke="#cfcbc3" stroke-width="1"/>
<rect x="40" y="330" width="680" height="34" rx="8" fill="#fbf3e4" stroke="#9a6a20" stroke-width="0.8"/>
<text x="56" y="352" font-size="13" fill="#9a6a20" font-weight="400" text-anchor="start">档案与户口必须在离校前确认去向；具体日期以本校就业部门与学院通知为准。</text>
<line x1="40" y1="382" x2="720" y2="382" stroke="#d9d6cf" stroke-width="1"/>
<text x="40" y="410" font-size="13" fill="#8a8a8a" font-weight="400" text-anchor="start">示意图 ｜ 本图只给先后顺序，不写具体日期：各校答辩、公示与派遣时间不同。</text>
</svg>
