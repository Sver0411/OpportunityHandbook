<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 546" width="760" height="546" font-family="PingFang SC, Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#9c9c9c" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<title>科研、竞赛、实习与升学就业的关系</title>
<text x="40" y="52" font-size="13" fill="#8a8a8a" font-weight="400" text-anchor="start">场景 9 · 四年规划</text>
<text x="40" y="92" font-size="27" fill="#1f1f1f" font-weight="500" text-anchor="start">四条线之间怎么互相供料</text>
<text x="40" y="122" font-size="15" fill="#5f5f5f" font-weight="400" text-anchor="start">课程是底座，中间两条线产出材料，出口那条线用材料。</text>
<rect x="280" y="150" width="200" height="52" rx="9" fill="#ffffff" stroke="#2f5d8a" stroke-width="0.9"/>
<text x="380" y="182" font-size="15" fill="#1f1f1f" font-weight="500" text-anchor="middle">升学 or 就业</text>
<rect x="280" y="232" width="200" height="52" rx="9" fill="#ffffff" stroke="#9a6a20" stroke-width="0.9"/>
<text x="380" y="264" font-size="13" fill="#9a6a20" font-weight="500" text-anchor="middle">简历 / 陈述 / 推荐信</text>
<rect x="80" y="316" width="200" height="72" rx="9" fill="#eef3f8" stroke="#2f5d8a" stroke-width="0.9"/>
<text x="96" y="344" font-size="15" fill="#1f1f1f" font-weight="500" text-anchor="start">科研与竞赛</text>
<text x="96" y="368" font-size="12" fill="#5f5f5f" font-weight="400" text-anchor="start">问题、方法、成果</text>
<rect x="480" y="316" width="200" height="72" rx="9" fill="#edf4ee" stroke="#3d6b45" stroke-width="0.9"/>
<text x="496" y="344" font-size="15" fill="#1f1f1f" font-weight="500" text-anchor="start">实习与实践</text>
<text x="496" y="368" font-size="12" fill="#5f5f5f" font-weight="400" text-anchor="start">经历、作品、评价</text>
<rect x="280" y="420" width="200" height="48" rx="8" fill="#f6f5f1" stroke="#d9d6cf" stroke-width="0.8"/>
<text x="380" y="449" font-size="13.5" fill="#1f1f1f" font-weight="500" text-anchor="middle">课程与 GPA（底座）</text>
<path d="M380 232 L380 204" fill="none" stroke="#9c9c9c" stroke-width="1.4" marker-end="url(#a)"/>
<path d="M210 316 L300 286" fill="none" stroke="#9c9c9c" stroke-width="1.4" marker-end="url(#a)"/>
<path d="M550 316 L460 286" fill="none" stroke="#9c9c9c" stroke-width="1.4" marker-end="url(#a)"/>
<line x1="180" y1="402" x2="580" y2="402" stroke="#b9b5ad" stroke-width="1.4"/>
<line x1="180" y1="388" x2="180" y2="402" stroke="#b9b5ad" stroke-width="1.4"/>
<line x1="580" y1="388" x2="580" y2="402" stroke="#b9b5ad" stroke-width="1.4"/>
<line x1="380" y1="420" x2="380" y2="402" stroke="#b9b5ad" stroke-width="1.4"/>
<text x="196" y="300" font-size="11.5" fill="#5f5f5f" font-weight="400" text-anchor="start">产出可写的项目</text>
<text x="470" y="300" font-size="11.5" fill="#5f5f5f" font-weight="400" text-anchor="start">产出可讲的经历</text>
<line x1="40" y1="500" x2="720" y2="500" stroke="#d9d6cf" stroke-width="1"/>
<text x="40" y="528" font-size="13" fill="#8a8a8a" font-weight="400" text-anchor="start">两条中间线不必都满：升学看科研与竞赛，就业看实习与作品，另一条保持及格。</text>
