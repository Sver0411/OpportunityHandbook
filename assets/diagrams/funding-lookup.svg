<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="PingFang SC, Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#9c9c9c" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<title>怎么找到学校的资助部门与正式政策</title>
<text x="40" y="52" font-size="13" fill="#8a8a8a" font-weight="400" text-anchor="start">场景 2 · 奖助学金</text>
<text x="40" y="92" font-size="27" fill="#1f1f1f" font-weight="500" text-anchor="start">从学校官网走到具体科室</text>
<text x="40" y="122" font-size="15" fill="#5f5f5f" font-weight="400" text-anchor="start">先找到「谁发通知」，再找「通知原文」；不要在搜索结果的转载页上做决定。</text>
<rect x="40" y="158" width="148" height="100" rx="9" fill="#ffffff" stroke="#2f5d8a" stroke-width="0.9"/>
<circle cx="60" cy="180" r="12" fill="#2f5d8a"/>
<text x="60" y="184" font-size="13" fill="#ffffff" font-weight="500" text-anchor="middle">1</text>
<text x="54" y="214" font-size="14" fill="#1f1f1f" font-weight="500" text-anchor="start">学校官网</text>
<text x="54" y="236" font-size="11.5" fill="#5f5f5f" font-weight="400" text-anchor="start">首页找「机构设置」</text>
<text x="54" y="254" font-size="11.5" fill="#5f5f5f" font-weight="400" text-anchor="start">或「职能部门」</text>
<path d="M190 208 L208 208" fill="none" stroke="#9c9c9c" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="212" y="158" width="148" height="100" rx="9" fill="#f6f5f1" stroke="#2f5d8a" stroke-width="0.9"/>
<circle cx="232" cy="180" r="12" fill="#2f5d8a"/>
<text x="232" y="184" font-size="13" fill="#ffffff" font-weight="500" text-anchor="middle">2</text>
<text x="226" y="214" font-size="14" fill="#1f1f1f" font-weight="500" text-anchor="start">学生工作部（处）</text>
<text x="226" y="236" font-size="11.5" fill="#5f5f5f" font-weight="400" text-anchor="start">多数学校资助业务</text>
<text x="226" y="254" font-size="11.5" fill="#5f5f5f" font-weight="400" text-anchor="start">挂在这里</text>
<path d="M362 208 L380 208" fill="none" stroke="#9c9c9c" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="384" y="158" width="148" height="100" rx="9" fill="#ffffff" stroke="#2f5d8a" stroke-width="0.9"/>
<circle cx="404" cy="180" r="12" fill="#2f5d8a"/>
<text x="404" y="184" font-size="13" fill="#ffffff" font-weight="500" text-anchor="middle">3</text>
<text x="398" y="214" font-size="14" fill="#1f1f1f" font-weight="500" text-anchor="start">学生资助管理中心</text>
<text x="398" y="236" font-size="11.5" fill="#5f5f5f" font-weight="400" text-anchor="start">科室页通常有</text>
<text x="398" y="254" font-size="11.5" fill="#5f5f5f" font-weight="400" text-anchor="start">办公地点与电话</text>
<path d="M534 208 L552 208" fill="none" stroke="#9c9c9c" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="556" y="158" width="148" height="100" rx="9" fill="#f6f5f1" stroke="#2f5d8a" stroke-width="0.9"/>
<circle cx="576" cy="180" r="12" fill="#2f5d8a"/>
<text x="576" y="184" font-size="13" fill="#ffffff" font-weight="500" text-anchor="middle">4</text>
<text x="570" y="214" font-size="14" fill="#1f1f1f" font-weight="500" text-anchor="start">通知与文件</text>
<text x="570" y="236" font-size="11.5" fill="#5f5f5f" font-weight="400" text-anchor="start">看原文，不看摘要</text>
<rect x="40" y="276" width="680" height="98" rx="9" fill="#fbf3e4" stroke="#9a6a20" stroke-width="0.8"/>
<text x="56" y="300" font-size="13.5" fill="#9a6a20" font-weight="500" text-anchor="start">判断一份通知是否可信，看三件事</text>
<text x="56" y="324" font-size="12.5" fill="#5f5f5f" font-weight="400" text-anchor="start">① 发布单位是学校或学院，不是个人或机构转载</text>
<text x="56" y="344" font-size="12.5" fill="#5f5f5f" font-weight="400" text-anchor="start">② 有发布日期与适用学年，不是往年的旧文件</text>
<text x="56" y="364" font-size="12.5" fill="#5f5f5f" font-weight="400" text-anchor="start">③ 写清适用对象、材料与截止时间，不是只有一句「可以申请」</text>
<rect x="40" y="386" width="680" height="34" rx="8" fill="#f6f5f1" stroke="#d9d6cf" stroke-width="0.8"/>
<text x="56" y="408" font-size="13" fill="#5f5f5f" font-weight="400" text-anchor="start">国家级政策可到全国学生资助管理中心核对；校级细则一律以本校文件为准。</text>
<line x1="40" y1="442" x2="720" y2="442" stroke="#d9d6cf" stroke-width="1"/>
<text x="40" y="470" font-size="13" fill="#8a8a8a" font-weight="400" text-anchor="start">示意图 ｜ 学校机构名称各不相同（学生处 / 学工部 / 研工部），找不到就问辅导员要科室名。</text>
</svg>
