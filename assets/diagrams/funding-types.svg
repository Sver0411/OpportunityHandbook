<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 486" width="760" height="486" font-family="PingFang SC, Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#9c9c9c" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<title>五类资助的区别</title>
<text x="40" y="52" font-size="13" fill="#8a8a8a" font-weight="400" text-anchor="start">场景 2 · 奖助学金</text>
<text x="40" y="92" font-size="27" fill="#1f1f1f" font-weight="500" text-anchor="start">先分清是哪一类，再准备材料</text>
<text x="40" y="122" font-size="15" fill="#5f5f5f" font-weight="400" text-anchor="start">同样叫「资助」，有的要还、有的不用还、有的要用劳动换。</text>
<rect x="40" y="156" width="128" height="206" rx="10" fill="#eef3f8" stroke="#2f5d8a" stroke-width="0.9"/>
<text x="104" y="186" font-size="15" fill="#2f5d8a" font-weight="500" text-anchor="middle">国家助学贷款</text>
<rect x="54" y="200" width="100" height="26" rx="6" fill="#ffffff" stroke="#2f5d8a" stroke-width="0.8"/>
<text x="104" y="218" font-size="13" fill="#2f5d8a" font-weight="400" text-anchor="middle">要还</text>
<text x="54" y="256" font-size="13" fill="#5f5f5f" font-weight="400" text-anchor="start">入学前在户籍地</text>
<text x="54" y="278" font-size="13" fill="#5f5f5f" font-weight="400" text-anchor="start">或入学后校园地</text>
<text x="54" y="332" font-size="12.5" fill="#2f5d8a" font-weight="400" text-anchor="start">看回执与合同</text>
<rect x="178" y="156" width="128" height="206" rx="10" fill="#edf4ee" stroke="#3d6b45" stroke-width="0.9"/>
<text x="242" y="186" font-size="15" fill="#3d6b45" font-weight="500" text-anchor="middle">奖学金</text>
<rect x="192" y="200" width="100" height="26" rx="6" fill="#ffffff" stroke="#3d6b45" stroke-width="0.8"/>
<text x="242" y="218" font-size="13" fill="#3d6b45" font-weight="400" text-anchor="middle">不用还</text>
<text x="192" y="256" font-size="13" fill="#5f5f5f" font-weight="400" text-anchor="start">按成绩与综测</text>
<text x="192" y="278" font-size="13" fill="#5f5f5f" font-weight="400" text-anchor="start">学院组织评定</text>
<text x="192" y="332" font-size="12.5" fill="#3d6b45" font-weight="400" text-anchor="start">看学院通知</text>
<rect x="316" y="156" width="128" height="206" rx="10" fill="#edf4ee" stroke="#3d6b45" stroke-width="0.9"/>
<text x="380" y="186" font-size="15" fill="#3d6b45" font-weight="500" text-anchor="middle">助学金</text>
<rect x="330" y="200" width="100" height="26" rx="6" fill="#ffffff" stroke="#3d6b45" stroke-width="0.8"/>
<text x="380" y="218" font-size="13" fill="#3d6b45" font-weight="400" text-anchor="middle">不用还</text>
<text x="330" y="256" font-size="13" fill="#5f5f5f" font-weight="400" text-anchor="start">先做困难认定</text>
<text x="330" y="278" font-size="13" fill="#5f5f5f" font-weight="400" text-anchor="start">再申请</text>
<text x="330" y="332" font-size="12.5" fill="#3d6b45" font-weight="400" text-anchor="start">先认定后申请</text>
<rect x="454" y="156" width="128" height="206" rx="10" fill="#fbf3e4" stroke="#9a6a20" stroke-width="0.9"/>
<text x="518" y="186" font-size="15" fill="#9a6a20" font-weight="500" text-anchor="middle">勤工助学</text>
<rect x="468" y="200" width="100" height="26" rx="6" fill="#ffffff" stroke="#9a6a20" stroke-width="0.8"/>
<text x="518" y="218" font-size="13" fill="#9a6a20" font-weight="400" text-anchor="middle">劳动换报酬</text>
<text x="468" y="256" font-size="13" fill="#5f5f5f" font-weight="400" text-anchor="start">校内岗位</text>
<text x="468" y="278" font-size="13" fill="#5f5f5f" font-weight="400" text-anchor="start">按月或按小时</text>
<text x="468" y="332" font-size="12.5" fill="#9a6a20" font-weight="400" text-anchor="start">看学工部门</text>
<rect x="592" y="156" width="128" height="206" rx="10" fill="#fbf3e4" stroke="#9a6a20" stroke-width="0.9"/>
<text x="656" y="186" font-size="15" fill="#9a6a20" font-weight="500" text-anchor="middle">临时困难补助</text>
<rect x="606" y="200" width="100" height="26" rx="6" fill="#ffffff" stroke="#9a6a20" stroke-width="0.8"/>
<text x="656" y="218" font-size="13" fill="#9a6a20" font-weight="400" text-anchor="middle">不用还</text>
<text x="606" y="256" font-size="13" fill="#5f5f5f" font-weight="400" text-anchor="start">突发变故</text>
<text x="606" y="278" font-size="13" fill="#5f5f5f" font-weight="400" text-anchor="start">临时困难</text>
<text x="606" y="332" font-size="12.5" fill="#9a6a20" font-weight="400" text-anchor="start">先找辅导员</text>
<rect x="40" y="386" width="680" height="44" rx="8" fill="#f6f5f1" stroke="#d9d6cf" stroke-width="0.8"/>
<text x="56" y="413" font-size="13.5" fill="#5f5f5f" font-weight="400" text-anchor="start">额度、比例、名额、申请时间每年每校都不同：一律以本校学生资助管理部门当年通知为准。</text>
<line x1="40" y1="444" x2="720" y2="444" stroke="#d9d6cf" stroke-width="1"/>
<text x="40" y="472" font-size="13" fill="#8a8a8a" font-weight="400" text-anchor="start">示意图 ｜ 判断顺序：先问「这笔钱要不要还」，再问「谁评定」，最后才看金额。</text>
</svg>
