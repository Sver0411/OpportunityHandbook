name: 内容校验

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: 校验内容、构建与内容测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 统一发布校验：与 Pages 使用同一个入口 tools/validate_release.py
      # （构建与元数据 / IA 一致性 / Markdown / 文档一致性 / 内容硬门 / 内容规则测试）
      - name: 发布校验（Release Validation）
        run: python3 tools/validate_release.py --quick

      - name: 正文深度审计（报告级，不阻塞）
        run: python3 tools/check_content_quality.py --depth

      - name: Metadata 审计（报告级，不阻塞）
        run: python3 tools/metadata_audit.py || true

      - name: 断言构建产物齐全
        run: |
          test -f site/data/index.json
          test -f site/sitemap.xml
          test -f site/robots.txt
          test -f "site/content/book/02-在学校里先把基础打好.html"
          test -f "site/content/book/09-专题手册.html"
          test -f "site/content/book/10-时间线与工具.html"
          test -f "site/content/docs/manuals/科研手册.html"
          test -f "site/content/docs/countries/日本.html"
          test -f "site/content/docs/tools/Offer对比表.html"
          test -f "site/pages/research-undergrad-start/index.html"
          test -f "site/pages/offer-comparison/index.html"
          # 左栏导航必须来自 navigation.json：一级栏目与 Canonical IA 完全一致
          python3 - <<'PYEOF'
          import json, pathlib
          idx = json.loads(pathlib.Path("site/data/index.json").read_text())
          nav = json.loads(pathlib.Path("meta/navigation.json").read_text())
          labels = [n["label"] for n in idx["nav"]]
          want = [n["title"] for n in nav["items"]]
          assert labels == want, f"左栏一级栏目与 Canonical IA 不一致：{labels} != {want}"
          print("一级栏目一致：", len(labels), "个")
          PYEOF
          # 旧地址的重定向表必须随构建产物一起存在
          python3 - <<'PYEOF'
          import json, pathlib
          red = json.loads(pathlib.Path("site/data/index.json").read_text())["redirects"]
          assert red["docs"], "文档级重定向为空"
          assert len(red["entries"]) > 100, "条目级重定向数量异常"
          print("重定向表正常：", len(red["docs"]), "个文档 /", len(red["entries"]), "个条目")
          PYEOF
          echo "构建产物正常"

      - name: 声明审计（只报告，不阻塞）
        run: python3 tools/audit_claims.py || true
