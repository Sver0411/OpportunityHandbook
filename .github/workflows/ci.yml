name: 内容校验

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: 校验内容、构建与内容测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 统一入口：元数据 / 重复 id / 内部链接与锚点 / 构建 / 前端语法 / 外链永久失效
      # strict 下任何警告（含元数据解析警告）都会失败；403/429/5xx/超时不阻塞
      - name: 严格校验与构建
        run: python3 tools/build.py --strict --report

      - name: 内容规则测试
        run: python3 tools/run_tests.py

      - name: 断言构建产物齐全
        run: |
          test -f site/data/index.json
          test -f site/sitemap.xml
          test -f site/robots.txt
          test -f "site/content/book/02-怎么判断一个机会值不值得.html"
          test -f "site/pages/research-undergrad-start/index.html"
          echo "构建产物正常"

      - name: 声明审计（只报告，不阻塞）
        run: python3 tools/audit_claims.py || true
