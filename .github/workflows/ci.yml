name: 内容校验

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: 校验内容、构建与内容测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 统一发布校验：与 Pages 使用同一个入口 tools/validate_release.py
      # （构建与元数据 / IA 一致性 / Markdown / 文档一致性 / 内容硬门 / 内容规则测试）
      - name: 发布校验（Release Validation）
        run: python3 tools/validate_release.py --quick

      - name: 正文深度审计（报告级，不阻塞）
        run: python3 tools/check_content_quality.py --depth

      - name: Metadata 审计（报告级，不阻塞）
        run: python3 tools/metadata_audit.py || true

      - name: 文章结构审计（报告级，不阻塞）
        run: python3 tools/audit_article_structure.py || true

      - name: 时间线审计（报告级，不阻塞）
        run: python3 tools/audit_timeline.py || true

      - name: 内容深度审计 v2（报告级，不阻塞）
        run: python3 tools/audit_content_depth_v2.py || true

      - name: 断言构建产物齐全
        run: |
          test -f site/data/index.json
          test -f site/data/reader.json
          test -f site/reader.js
          test -f site/reader.css
          test -f site/sitemap.xml
          test -f site/robots.txt
          test -f "site/content/book/02-在学校里先把基础打好.html"
          test -f "site/content/book/10-专题手册.html"
          test -f "site/content/book/11-路径时间线.html"
          test -f "site/content/book/12-工具与模板.html"
          test -f "site/content/book/13-完整案例.html"
          test -f "site/content/book/14-操作手册.html"
          test -f "site/content/book/15-避坑.html"
          test -f "site/content/docs/manuals/科研手册.html"
          test -f "site/content/docs/countries/日本.html"
          test -f "site/content/docs/tools/Offer对比表.html"
          test -f "site/pages/research-undergrad-start/index.html"
          test -f "site/pages/offer-comparison/index.html"
          # 原始来源目录保持 Canonical IA；网页使用独立的读者目录
          python3 - <<'PYEOF'
          import json, pathlib
          idx = json.loads(pathlib.Path("site/data/index.json").read_text())
          nav = json.loads(pathlib.Path("meta/navigation.json").read_text())
          # 左栏显示名可以是 nav_label；章节标题(title)保持不变
          labels = [n["label"] for n in idx["nav"]]
          want = [(n.get("nav_label") or n["title"]) for n in nav["items"]]
          assert labels == want, f"来源栏目与 Canonical IA 不一致：{labels} != {want}"
          reader = json.loads(pathlib.Path("site/data/reader.json").read_text())["reader"]
          groups = reader["topics"] + reader["atlases"] + [reader["resources"]]
          assert [n["nav_id"] for n in reader["navigation"]] == [n["id"] for n in groups]
          assert "public-sector" in {n["id"] for n in reader["topics"]}, "缺少考公考编一级章节"
          assert all(n.get("intro_html") for n in groups), "一级概览缺少导读正文"
          coverage = reader["coverage"]
          assert coverage["source_routes"] == coverage["assigned_routes"] == len(reader["owners"])
          print("来源栏目：", len(labels), "个；读者栏目：", len(groups), "个；内容覆盖完整")
          PYEOF
          # 旧地址的重定向表必须随构建产物一起存在
          python3 - <<'PYEOF'
          import json, pathlib
          red = json.loads(pathlib.Path("site/data/index.json").read_text())["redirects"]
          assert red["docs"], "文档级重定向为空"
          assert len(red["entries"]) > 100, "条目级重定向数量异常"
          print("重定向表正常：", len(red["docs"]), "个文档 /", len(red["entries"]), "个条目")
          PYEOF
          echo "构建产物正常"

      - name: 声明审计（只报告，不阻塞）
        run: python3 tools/audit_claims.py || true
